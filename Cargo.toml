[package]
name = "termtastic"
# unused, app version propagated by git tags
version = "0.0.0"
edition = "2024"
authors = ["acelot <provaleriy@gmail.com>"]
description = "Feature-rich Meshtastic® console client"
publish = false
license-file = "LICENSE"
repository = "https://github.com/acelot/termtastic"
readme = "README.md"
keywords = ["cli", "tui", "meshtastic"]
build = "build.rs"

[[bin]]
name = "termtastic"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

[lints.clippy]
single-match = "allow"

[dependencies]
ansi-to-tui = { version = "8.0" }
anyhow = { version = "1.0" }
arboard = { version = "3.6", features = ["wayland-data-control"] }
base64 = { version = "0.23" }
btleplug = { version = "0.13.4", features = ["serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
confy = { version = "2.0", default-features = false, features = ["ron_conf"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
emoji = { version = "0.2" }
etcetera = { version = "0.11.0" }
fastrand = { version = "2.5" }
futures = { version = "0.3.34" }
hostaddr = { version = "0.3.0", features = ["serde"] }
itertools = { version = "0.15.0" }
mdns-sd = { version = "0.21.5" }
meshtastic = { git = "https://github.com/acelot/rust-meshtastic.git", rev = "1741a83", features = [
    "bluetooth-le",
] }
nameof = { version = "1.3" }
ordermap = { version = "1.2.2", features = ["serde"] }
paste = { version = "1.0" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.3" }
regex = { version = "1.13" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rusqlite_migration = { version = "2.6" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
serde_rusqlite = { version = "0.43.0" }
serde_sqlite_jsonb = { version = "0.2.1" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { version = "2.0.21" }
tokio = { version = "1.53.2", features = ["full"] }
tokio-graceful-shutdown = { version = "0.20.0" }
tokio-rusqlite-new = { version = "0.14.0" }
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-unwrap = { version = "1.0.1" }
tui-widget-list = { version = "0.15.3" }
unicode-width = { version = "0.2.2" }
