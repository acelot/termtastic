[package]
name = "termtastic"
# unused, app version propagated by git tags
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["acelot <provaleriy@gmail.com>"]
description = "Feature-rich Meshtastic® console client"
publish = false
license-file = "LICENSE"
repository = "https://github.com/acelot/termtastic"
readme = "README.md"
keywords = ["console", "cli", "tui", "client", "meshtastic", "lora"]
build = "build.rs"

[[bin]]
name = "termtastic"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true

[target.'cfg(target_os = "linux")'.dependencies]
libdbus-sys = { version = "0.2", features = ["vendored"] }

[lints.clippy]
single_match = "allow"

[dependencies]
ansi-to-tui = { version = "8.0" }
anyhow = { version = "1.0" }
arboard = { version = "3.7", features = ["wayland-data-control"] }
base64 = { version = "0.23" }
btleplug = { version = "0.13.5", features = ["serde"] }
confy = { version = "2.0", default-features = false, features = ["ron_conf"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
emojis = { version = "0.9.1" }
etcetera = { version = "0.11.0" }
fastrand = { version = "2.5" }
futures = { version = "0.3.34" }
hostaddr = { version = "1.1", features = ["serde"] }
itertools = { version = "0.15.0" }
jiff = { version = "0.2.46", features = ["serde"] }
mdns-sd = { version = "0.22.0" }
meshtastic = { git = "https://github.com/acelot/rust-meshtastic.git", rev = "0b51541", features = [
    "bluetooth-le",
] }
nameof = { version = "1.3" }
ordermap = { version = "1.2", features = ["serde"] }
paste = { version = "1.0" }
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
ratatui-textarea = { version = "0.9.4" }
regex = { version = "1.13" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.41.1", features = [
    "bundled",
    "hooks",
    "jiff",
    "uuid",
    "functions",
] }
rusqlite_migration = { version = "2.7" }
semver = { version = "1.0" }
serde = { version = "1.0" }
serde_json = { version = "1.0" }
serde_rusqlite = { version = "0.44.0" }
serde_sqlite_jsonb = { version = "0.2.1" }
strum = { version = "0.28.0", features = ["derive"] }
thiserror = { version = "2.0" }
tokio = { version = "1.54", features = ["full"] }
tokio-graceful-shutdown = { version = "0.20.0" }
tokio-rusqlite-new = { version = "0.15.0" }
tracing = { version = "0.1.44" }
tracing-appender = { version = "0.2.5" }
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
tracing-unwrap = { version = "1.0.1" }
tui-scrollview = { git = "https://github.com/acelot/tui-widgets.git", rev = "831e6a9" }
#tui-widget-list = { version = "0.15.4" }
tui-widget-list = { git = "https://github.com/acelot/tui-widget-list.git", rev = "cb57b26" }
unicode-width = { version = "0.2.3" }
uuid = { version = "1.29", features = ["serde", "v7"] }
