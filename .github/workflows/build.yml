name: Termtastic Pipeline

on:
  push:
    branches: [master]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_REF_TYPE: ${{ github.ref_type }}
  GIT_REF_NAME: ${{ github.ref_name }}
  GIT_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build for ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      BINARY_NAME: ${{ matrix.binary_name }}
      ARCHIVE_NAME: termtastic-${{ matrix.target }}${{ matrix.archive_ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: .zip
            binary_name: termtastic.exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: .tar.gz
            binary_name: termtastic

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Install system dependencies for Linux (musl)
        if: endsWith(matrix.target, '-linux-musl')
        run: |
          sudo apt-get update && \
          sudo apt-get install -y \
            musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp target/${{ matrix.target }}/release/termtastic.exe ${{ env.BINARY_NAME }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/termtastic ${{ env.BINARY_NAME }}
          chmod +x ${{ env.BINARY_NAME }} || true

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: 7z a -tzip ${{ env.ARCHIVE_NAME }} ${{ env.BINARY_NAME }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tar czf ${{ env.ARCHIVE_NAME }} ${{ env.BINARY_NAME }}

      - name: Attest archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            artifacts/**/*

  update-homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: acelot/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate formula
        shell: bash
        run: |
          VERSION="${GIT_REF_NAME#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${GIT_REF_NAME}"
          sha() { sha256sum "artifacts/termtastic-$1.tar.gz/termtastic-$1.tar.gz" | cut -d' ' -f1; }

          mkdir -p tap/Formula
          cat > tap/Formula/termtastic.rb <<EOF
          class Termtastic < Formula
            desc "Feature-rich Meshtastic console client"
            homepage "https://github.com/acelot/termtastic"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "${BASE_URL}/termtastic-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${BASE_URL}/termtastic-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/termtastic-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${BASE_URL}/termtastic-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "termtastic"
            end

            test do
              assert_predicate bin/"termtastic", :executable?
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/termtastic.rb
          cat tap/Formula/termtastic.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termtastic.rb
          git commit -m "termtastic ${GIT_REF_NAME}" || exit 0
          git push
