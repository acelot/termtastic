name: Termtastic Pipeline

on:
  push:
    branches: [master, docker-image]
    tags:
      - "v*"
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_REF_TYPE: ${{ github.ref_type }}
  GIT_REF_NAME: ${{ github.ref_name }}
  GIT_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build for ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.ref != 'refs/heads/docker-image'
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      BINARY_NAME: ${{ matrix.binary_name }}
      ARCHIVE_NAME: termtastic-${{ matrix.target }}${{ matrix.archive_ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive_ext: .zip
            binary_name: termtastic.exe

          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: x86_64-apple-darwin
            os: macos-latest
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: aarch64-apple-darwin
            os: macos-latest
            archive_ext: .tar.gz
            binary_name: termtastic

          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build release binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          command: build
          args: --release

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp target/${{ matrix.target }}/release/termtastic.exe ${{ env.BINARY_NAME }}

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/termtastic ${{ env.BINARY_NAME }}
          chmod +x ${{ env.BINARY_NAME }} || true

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: 7z a -tzip ${{ env.ARCHIVE_NAME }} ${{ env.BINARY_NAME }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: tar czf ${{ env.ARCHIVE_NAME }} ${{ env.BINARY_NAME }}

      - name: Attest archive
        uses: actions/attest@v4
        with:
          subject-path: ${{ env.ARCHIVE_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
      attestations: write
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: false
          files: |
            artifacts/**/*

  update-homebrew:
    name: Update Homebrew tap
    runs-on: ubuntu-latest
    needs: create-release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checkout tap
        uses: actions/checkout@v6
        with:
          repository: acelot/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Generate formula
        shell: bash
        run: |
          VERSION="${GIT_REF_NAME#v}"
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${GIT_REF_NAME}"
          sha() { sha256sum "artifacts/termtastic-$1.tar.gz/termtastic-$1.tar.gz" | cut -d' ' -f1; }

          mkdir -p tap/Formula
          cat > tap/Formula/termtastic.rb <<EOF
          class Termtastic < Formula
            desc "Feature-rich Meshtastic console client"
            homepage "https://github.com/acelot/termtastic"
            version "${VERSION}"
            license "GPL-3.0-only"

            on_macos do
              on_arm do
                url "${BASE_URL}/termtastic-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${BASE_URL}/termtastic-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_arm do
                url "${BASE_URL}/termtastic-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "$(sha aarch64-unknown-linux-gnu)"
              end
              on_intel do
                url "${BASE_URL}/termtastic-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "termtastic"
            end

            test do
              assert_predicate bin/"termtastic", :executable?
            end
          end
          EOF
          sed -i 's/^          //' tap/Formula/termtastic.rb
          cat tap/Formula/termtastic.rb

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/termtastic.rb
          git commit -m "termtastic ${GIT_REF_NAME}" || exit 0
          git push

  docker-build:
    name: Build Docker image for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/docker-image'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/termtastic
    steps:
      - name: Prepare environment
        run: |
          echo "PLATFORM_PAIR=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_ENV"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            # сборка из ветки: версия = короткий SHA
            echo "VERSION=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          fi

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          labels: |
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ env.VERSION }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=docker-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-publish:
    name: Publish multi-arch Docker image
    runs-on: ubuntu-latest
    needs: docker-build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/docker-image'
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/termtastic
    steps:
      - name: Prepare environment
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
            PRIMARY_TAG="v${VERSION}"
          else
            VERSION="${GITHUB_SHA::7}"
            PRIMARY_TAG="sha-${VERSION}"
          fi
          {
            echo "VERSION=${VERSION}"
            echo "PRIMARY_TAG=${PRIMARY_TAG}"
          } >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tags=(
              -t "${IMAGE_NAME}:v${VERSION}"
              -t "${IMAGE_NAME}:${VERSION}"
              -t "${IMAGE_NAME}:latest"
            )
          else
            tags=(
              -t "${IMAGE_NAME}:docker-image"
              -t "${IMAGE_NAME}:sha-${VERSION}"
            )
          fi
          docker buildx imagetools create "${tags[@]}" $(printf "${IMAGE_NAME}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${PRIMARY_TAG}"
