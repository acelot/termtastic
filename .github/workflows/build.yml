name: Termtastic Pipeline

on:
  push:
    branches: [arm-unknown-linux-gnueabihf-debug]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  GIT_REF_TYPE: ${{ github.ref_type }}
  GIT_REF_NAME: ${{ github.ref_name }}
  GIT_SHA: ${{ github.sha }}

jobs:
  build:
    name: Build for ${{ matrix.target }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    if: github.ref != 'refs/heads/docker-image'
    permissions:
      id-token: write
      attestations: write
      contents: write
    env:
      BINARY_NAME: ${{ matrix.binary_name }}
      ARCHIVE_NAME: termtastic-${{ matrix.target }}${{ matrix.archive_ext }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04
            archive_ext: .tar.gz
            binary_name: termtastic

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build debug binary
        if: matrix.target == 'arm-unknown-linux-gnueabihf'
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: ${{ matrix.target }}
          command: build

      - name: Prepare binary (Unix)
        shell: bash
        run: |
          cp target/${{ matrix.target }}/debug/termtastic ${{ env.BINARY_NAME }}
          chmod +x ${{ env.BINARY_NAME }} || true

      - name: Create archive (Unix)
        shell: bash
        run: tar czf ${{ env.ARCHIVE_NAME }} ${{ env.BINARY_NAME }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: ${{ env.ARCHIVE_NAME }}
